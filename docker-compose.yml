services:
  news-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news-automation-runner
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./digests:/app/digests
      - ./daily-summary.md:/app/daily-summary.md
      - ./config.json:/app/config.json:ro
    # Default runs daily_news.py directly; override with e.g. ["--dry-run"]
    command: []

  news-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news-automation-scheduler
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - RUN_INTERVAL_SECONDS=86400
    volumes:
      - ./digests:/app/digests
      - ./daily-summary.md:/app/daily-summary.md
      - ./config.json:/app/config.json:ro
    command:
      - |
        echo "News Automation Scheduler started (Interval: $${RUN_INTERVAL_SECONDS}s)..."
        while true; do
          echo "Executing daily news run at $$(date)..."
          python daily_news.py || echo "[WARN] Run encountered an issue at $$(date)"
          echo "Execution completed. Sleeping for $${RUN_INTERVAL_SECONDS} seconds..."
          sleep "$${RUN_INTERVAL_SECONDS}"
        done
