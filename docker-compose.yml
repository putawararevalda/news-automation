x-casaos:
  architectures:
    - amd64
    - arm64
    - arm
  main: frontend
  description:
    en_us: Modern Web Operations & Analytics Dashboard for News Automation.
  tagline:
    en_us: AI News Aggregator & Operations Dashboard
  developer: Revalda Putawara
  author: Revalda Putawara
  icon: https://raw.githubusercontent.com/putawararevalda/news-automation/main/docs/icon.png
  thumbnail: https://raw.githubusercontent.com/putawararevalda/news-automation/main/docs/thumbnail.png
  title:
    en_us: News Automation
  index: /
  port_map: "58619"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: news-automation-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=${TZ:-Asia/Jakarta}
      - DATABASE_URL=sqlite:////app/data/news.db
      - CRON_SCHEDULE=${CRON_SCHEDULE:-0 6 * * *}
      - PORT=8000
    volumes:
      - ./data:/app/data
      - ./digests:/app/digests
      - ./daily-summary.md:/app/daily-summary.md
      - ./config.json:/app/config.json:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: news-automation-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend:8000
      - PORT=58619
    ports:
      - "${PORT:-58619}:58619"
    volumes:
      - ./data:/app/data:ro
      - ./digests:/app/digests:ro
    x-casaos:
      ports:
        - container: "58619"
          description:
            en_us: Web Dashboard Port

  # Standalone CLI runner for backward compatibility and ad-hoc terminal invocations
  news-runner:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: news-automation-runner
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=${TZ:-Asia/Jakarta}
    volumes:
      - ./data:/app/data
      - ./digests:/app/digests
      - ./daily-summary.md:/app/daily-summary.md
      - ./config.json:/app/config.json:ro
    entrypoint: ["python", "daily_news.py"]
    command: []
    profiles:
      - cli
